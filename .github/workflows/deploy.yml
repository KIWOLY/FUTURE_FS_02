name: Build & Deploy CRM

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Generate version tag
        id: version
        run: echo "TAG=$(date +'%Y%m%d')-${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./crm-backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            kiwoly/crm-backend:latest
            kiwoly/crm-backend:${{ steps.version.outputs.TAG }}

      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./crm-frontend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            kiwoly/crm-frontend:latest
            kiwoly/crm-frontend:${{ steps.version.outputs.TAG }}
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ~/crm_app
            docker compose pull
            docker compose up -d
            docker image prune -f